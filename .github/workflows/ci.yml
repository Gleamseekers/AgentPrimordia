name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== 变更范围检测：按 source root 选择性触发 Go/TS 检查 =====
  changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
      py: ${{ steps.filter.outputs.py }}
      rust: ${{ steps.filter.outputs.rust }}
      workspace: ${{ steps.filter.outputs.workspace }}
      dual-line: ${{ steps.filter.outputs.dual-line }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'agentprimordia/**'
            ts:
              - 'sdk/typescript/**'
            py:
              - 'sdk/python/**'
            rust:
              - 'sdk/rust/**'
            workspace:
              - 'wasm/**'
              - 'pgvector/**'
              - 'gateway/**'
            # 双线召回门的共享输入：任一变更都可能让两份夹具"同向过期"，必须触发对账 job。
            dual-line:
              - 'docs/evals/**'
              - 'scripts/dual-line-recall-check.mjs'
              - '.github/workflows/ci.yml'
              - 'agentprimordia/Makefile'
              - 'agentprimordia/bench/results/s0-3-recall-go.json'
              - 'sdk/typescript/bench/results/s0-3-recall-ts.json'

  test:
    name: Go Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Build
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 0
        run: go build ./...

      # go vet 门（2026-09-28 增补）：copylocks/未用导入/printf 等类缺陷
      # 曾因无 vet 门漏网（cmd/ap/autonomy.go 锁拷贝即实例）。
      # vet 同时编译测试文件，可提前拦截测试代码腐烂。
      - name: Vet
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      - name: Test with race detector
        if: runner.os != 'Windows'
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 1
          SOAK_CI_MODE: '1'  # CI 共享 runner 抖动会导致 soak 退化误报（见 studio_soak_test）
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic -count=1 ./... \
            || { go test -race -count=1 -v ./... > test-failure.log 2>&1; echo "::error::Go tests failed — see test-failure.log artifact"; exit 1; }

      - name: Upload failure log (race)
        if: runner.os != 'Windows' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-test-failure-log
          path: agentprimordia/test-failure.log

      - name: Test without race detector (Windows)
        if: runner.os == 'Windows'
        working-directory: agentprimordia
        # pwsh 会把 ./... 的 ... 当 spread 运算符展开（报 package .out）
        shell: bash
        env:
          CGO_ENABLED: 0
          SOAK_CI_MODE: '1'  # 同 ubuntu/mac（见 studio_soak_test）
        run: |
          go test -coverprofile=coverage.out -covermode=atomic -count=1 ./... \
            || { go test -count=1 -v ./... > test-failure.log 2>&1; echo "::error::Go tests failed — see test-failure.log artifact"; exit 1; }

      - name: Upload failure log (Windows)
        if: runner.os == 'Windows' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-failure-log
          path: agentprimordia/test-failure.log

      # 无 API Key 的集成测试（MockLLM 驱动完整链路：ReAct+工具+流式+记忆）。
      # 与 test-integration（真实 key）互补，保证 CI 无 key 环境也有集成保障。
      - name: Integration tests without API key (MockLLM)
        if: matrix.os == 'ubuntu-latest'
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 0
        run: go test -tags=integration -count=1 -timeout=5m -run 'MockIntegration' ./internal/agent/...

      - name: "Check coverage (Phase 7.2: tiered gate, 8.1: Tier 3 soft gate)"
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        working-directory: agentprimordia
        run: |
          # Total coverage (reference metric)
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

          # Tiered gate checks
          fail=0
          warn=0
          for tier in "internal/agent:80" "internal/llm:65" "pkg:65"; do
            path=${tier%:*}
            threshold=${tier#*:}
            cov=$(go test -cover ./$path 2>&1 | grep -oE '[0-9.]+%' | head -1 | tr -d '%')
            if [ -z "$cov" ]; then
              echo "  $path: SKIP (no test)"
              continue
            fi
            echo "  $path: ${cov}% (tier 1/2, threshold ${threshold}%)"
            if (( $(echo "$cov < $threshold" | bc -l) )); then
              echo "::error::$path coverage ${cov}% < ${threshold}%"
              fail=1
            fi
          done

          # Tier 3 soft gate: core packages >= 50% (warn only, not fail)
          for pkg in internal/memory internal/tools internal/orchestration internal/persist; do
            cov=$(go test -cover ./$pkg 2>&1 | grep -oE '[0-9.]+%' | head -1 | tr -d '%')
            if [ -z "$cov" ]; then continue; fi
            echo "  $pkg: ${cov}% (tier 3 soft, target 50%)"
            if (( $(echo "$cov < 50" | bc -l) )); then
              echo "::warning::$pkg coverage ${cov}% < 50% (tier 3 soft gate)"
              warn=1
            fi
          done

          if [ $fail -eq 1 ]; then
            echo "::error::Tier 1/2 coverage gate failed."
            exit 1
          fi
          if [ $warn -eq 1 ]; then
            echo "::warning::Tier 3 soft gate has warnings (non-blocking)."
          fi
          echo "OK: tiered coverage gates passed"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: agentprimordia/coverage.out

      - name: Check Deprecated annotations (Phase 8.4)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/deprecation-check.sh

      - name: Check CHANGELOG [Unreleased] (Phase 8.4)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! grep -q "^## \[Unreleased\]" docs/CHANGELOG.md; then
            echo "::warning::CHANGELOG.md 缺 [Unreleased] 节"
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run govulncheck
        working-directory: agentprimordia
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Go license check
        working-directory: agentprimordia
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... 2>&1 || echo "::warning::许可证检查发现问题（非阻塞）"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install npm dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run npm audit (strict)
        working-directory: sdk/typescript
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Socket security scan
        working-directory: sdk/typescript
        env:
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}
        run: |
          if [ -n "$SOCKET_API_KEY" ]; then
            npx @socketsecurity/cli scan --strict || echo "::warning::Socket 扫描发现问题"
          else
            echo "::notice::Socket API key 未配置，跳过 Socket 扫描"
          fi
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true
          # 拒绝已知漏洞的依赖
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0

  api-diff:
    name: API Compatibility Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check Go API compatibility
        working-directory: agentprimordia
        run: |
          go install golang.org/x/exp/cmd/apidiff@latest
          # Compare public API against base branch
          BASE_REF=${{ github.base_ref }}
          git checkout "origin/$BASE_REF" -- pkg/
          apidiff -w /tmp/base.api ./pkg/...
          git checkout HEAD -- pkg/
          apidiff -incompatible /tmp/base.api ./pkg/... || {
            echo "::error::Incompatible API changes detected. Review before merging."
            exit 1
          }

  ts-test:
    name: TypeScript SDK Test (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Type check
        working-directory: sdk/typescript
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        working-directory: sdk/typescript
        run: npm run lint

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: API Compatibility Check
        working-directory: sdk/typescript
        run: npx api-extractor run --local

      - name: Test with coverage
        working-directory: sdk/typescript
        run: npm test -- --coverage

      - name: Upload TS coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: sdk/typescript/coverage

  python-sdk:
    name: Python SDK Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.py == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check (compileall)
        working-directory: sdk/python
        run: python -m compileall -q agentprimordia

      - name: Import check
        working-directory: sdk/python
        run: python -c "from agentprimordia.client import AgentPrimordia; from agentprimordia import __version__; print('Python SDK import OK, version', __version__)"

      - name: Verify no mojibake (U+FFFD) in source
        working-directory: sdk/python
        run: |
          if grep -rlP '\xEF\xBF\xBD' agentprimordia/ ; then
            echo "::error::Python SDK 源码存在 U+FFFD 乱码字符（编码损坏），请修复。"
            exit 1
          fi
          echo "OK: Python SDK 源码无乱码"

      - name: Run unit tests (stdlib unittest, 本地 mock 服务)
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v

  rust-sdk:
    name: Rust SDK Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust

      - name: Build (check)
        working-directory: sdk/rust
        run: cargo build --locked

      - name: Clippy lint
        working-directory: sdk/rust
        run: cargo clippy -- -D warnings

      - name: Test (本地 TcpListener mock 服务)
        working-directory: sdk/rust
        run: cargo test --locked

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build ap CLI
        working-directory: agentprimordia
        run: go build -ldflags="-X main.Version=${{ github.ref_name }}" -o ap ./cmd/ap/

      - name: Verify CLI
        working-directory: agentprimordia
        run: ./ap version

  cross-compile:
    name: Cross-Compile Verify (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cross-compile binary
        working-directory: agentprimordia
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY=ap-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=${BINARY}.exe
          fi
          go build -ldflags="-s -w -X main.Version=ci-${{ github.sha }}" -o ${BINARY} ./cmd/ap/

      - name: Verify binary exists
        working-directory: agentprimordia
        run: |
          BINARY=ap-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=${BINARY}.exe
          fi
          test -f ${BINARY} && echo "OK: ${BINARY} built successfully"
          ls -lh ${BINARY}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}

      # golangci-lint 官方预编译二进制用 Go 1.24 构建，无法解析 go 1.26 模块
      # （can't load config）；改为 go install 源码编译（用本 job 的 Go 1.26）
      - name: Install golangci-lint (source build)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        working-directory: agentprimordia
        run: golangci-lint run --timeout 5m 2>&1 | tee golangci-lint.log; test ${PIPESTATUS[0]} -eq 0

      - name: Upload lint log (diagnostic)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-failure-log
          path: |
            agentprimordia/golangci-lint.log
            agentprimordia/*.out
          if-no-files-found: ignore

  operator-envtest:
    name: Operator EnvTest (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-

      - name: Download dependencies
        run: go mod download

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Fetch envtest binaries
        run: |
          ENVTEST_DIR=$(setup-envtest use -p path 1.32.x)
          echo "KUBEBUILDER_ASSETS=$ENVTEST_DIR" >> $GITHUB_ENV
          echo "Fetched envtest assets at: $ENVTEST_DIR"

      - name: Run envtest E2E tests
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 0
        run: go test -tags=envtest -v -timeout=120s ./operator/controller/...

  # ===== 分布式后端集成测试（etcd + Redis 真实服务） =====

  distributed-backend-tests:
    name: Distributed Backend Integration (etcd + Redis)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.12
        env:
          ETCD_LISTEN_CLIENT_URLS: 'http://0.0.0.0:2379'
          ETCD_ADVERTISE_CLIENT_URLS: 'http://127.0.0.1:2379'
        ports:
          - 2379:2379
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-

      - name: Download dependencies
        run: go mod download

      - name: Wait for etcd and Redis readiness
        run: |
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/2379) 2>/dev/null; do sleep 1; done' && echo "etcd ready"
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; do sleep 1; done' && echo "redis ready"

      - name: Run etcd + Redis checkpoint integration tests
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 0
        run: go test -tags=etcd,redis -count=1 -timeout=10m -v ./internal/persist/...

      # 修复：移除过窄的 -run 过滤——原过滤 'EtcdKVStore|EtcdEndpoint' 会漏掉
      # TestLeaseManager_Integration（etcd 租约管理集成测试）。etcd tag 下该包
      # 仅含 etcd 相关测试，全量运行即可。
      - name: Run etcd cluster discovery + lease integration tests
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 0
        run: go test -tags=etcd -count=1 -timeout=10m -v ./internal/agent/cluster/...

  # ===== 工作区子模块门禁（wasm A4 / pgvector / gateway） =====
  # 背景：上面的 test job 只在 agentprimordia/ 下跑 `go test ./...`，嵌套模块
  # （wasm/、pgvector/、gateway/）不在其 ./... 范围内 —— 于是 A4（零值配置回退边界，
  # 断言定义见 docs/提案-code层沙箱受控释放.md §二）长期无 CI 覆盖，与 AGENTS.md
  # §2.3「断言测试全部进 CI、失败即红」不符。本 job 补齐该缺口（2026-10-17）。
  # 触发面覆盖三个模块本身：changes filters 的 `workspace` = wasm/** + pgvector/** + gateway/**。
  workspace-modules:
    name: Workspace Modules (wasm A4 / pgvector / gateway)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-

      - name: Test root wasm module (含 A4 边界断言)
        working-directory: wasm
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...
          go test -count=1 ./...

      - name: Test pgvector module
        working-directory: pgvector
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...
          go test -count=1 ./...

      - name: Test gateway module
        working-directory: gateway
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...
          go test -count=1 ./...

  # ===== S0-3 双线召回对账门（Go 臂 × TS 臂） =====
  # 背景：scripts/dual-line-recall-check.mjs 自 S0-3 落地起就是"门存在但从不运行"——
  # 全仓（CI / Makefile / nightly / release）零消费者，对账结论只存在于人工批次里。
  # 本 job 把它接线进 CI，并且不只做"已提交夹具互相对账"（那种对账在两侧同步漂移时仍绿），
  # 而是先用 AP_WRITE_S03_RESULTS=1 真跑两侧 lexical 底档臂，再对账，最后断言
  # 重生成结果与已提交夹具逐字节一致（夹具确定性）。两臂均为离线 lexical 降级位臂
  # （semantic=false，语义臂 ≥0.95 需真实端点，带降级豁免），实测重生成零 diff。
  dual-line-recall:
    name: Dual-Line Recall Reconciliation (S0-3)
    runs-on: ubuntu-latest
    needs: [changes]
    # 触发面必须覆盖"两臂共享输入"：语料 docs/evals/**、门脚本 scripts/**、工作流自身与两份夹具
    # （否则改语料 → 两夹具同向过期 → job 不跑 → 假绿）。
    # 注：带连字符的 output 名用**方括号**取值（`outputs['dual-line']`）——点号写法在生态中虽常见
    # （如 actions/cache 的 `steps.cache.outputs.cache-hit`），但 GitHub 官方表达式文档未对连字符做
    # 明文承诺；方括号写法无歧义，故此处取零风险形式（2026-10-17 复核建议）。
    if: >-
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ts == 'true' ||
      needs.changes.outputs['dual-line'] == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install npm dependencies
        working-directory: sdk/typescript
        run: npm ci

      # 单一真源：四步（先删夹具重生成两臂 → 对账 → 夹具零 diff/无 untracked）都定义在
      # agentprimordia/Makefile 的 dual-line-recall 目标里，CI 不再复制一份步骤（避免两处漂移）。
      - name: S0-3 双线召回对账（make -C agentprimordia dual-line-recall）
        env:
          CGO_ENABLED: 0
        run: make -C agentprimordia dual-line-recall

  # ===== API 契约基线检查（防 pkg/ 公共 API 契约过期） =====

  contract-baseline:
    name: API Contract Baseline Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26-

      - name: Download dependencies
        run: go mod download

      - name: Regenerate API contract and check drift
        working-directory: agentprimordia
        run: |
          go run ./scripts/api-extract/ -no-timestamp -output /tmp/api-contract.json
          if ! cmp -s /tmp/api-contract.json ../sdk/typescript/api-contract.json; then
            echo "::error::sdk/typescript/api-contract.json 与当前 pkg/ 公共 API 漂移。"
            echo "::error::请在 agentprimordia/ 下运行 'make api-extract'（或 go run ./scripts/api-extract/ -no-timestamp -output ../sdk/typescript/api-contract.json）并提交更新。"
            diff ../sdk/typescript/api-contract.json /tmp/api-contract.json | head -40 || true
            exit 1
          fi
          echo "OK: API 契约与当前代码一致"

  # ===== Phase 4: 跨语言同步验证 =====

  # ===== v3.9-3：文档站自动构建 =====
  # vitepress 文档站每次 PR/推送自动构建，确保文档可发布、无断链错误。
  docs-build:
    name: Docs Build (vitepress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build docs site
        working-directory: sdk/typescript
        run: npm run docs:build

      - name: Dead-link gate (v4.4-4)
        run: node scripts/check-docs-links.mjs

  cross-language-check:
    name: Cross-Language API Compatibility
    runs-on: ubuntu-latest
    needs: [changes, test, ts-test]
    if: always() && needs.changes.outputs.go == 'true' && needs.changes.outputs.ts == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cross-language API compatibility check
        run: node scripts/cross-language-api-check.mjs

      - name: Run dual-SDK version sync check
        run: node scripts/version-sync-check.mjs

  eval-gates:
    name: Eval Registry & Dual-Line Gates (V7 S0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # V7 新规 R4：题面一经冻结不得修改——台账与磁盘 sha256 对账，漂移即红
      - name: 题面冻结门（eval-manifest verify）
        run: python3 scripts/eval-manifest.py --verify

      - name: 题面台账结构自检（留出比例 ≥30% / id 唯一）
        run: python3 scripts/eval-manifest.py --check

      # S0-5：双线豁免矩阵进 CI（豁免必须带理由与升格条件；已落地路径必须存在）
      - name: 双线豁免矩阵门（dual-line-matrix-check）
        run: node scripts/dual-line-matrix-check.mjs

  version-consistency:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run version consistency check
        run: bash scripts/version-check.sh

      # V7.3 整改：版本真值唯一来源 = pkg/agent.go const Version。
      # 该门无条件运行（不受 path filter 影响），对账 VERSION/TS/Helm/文档锚点/README 统计，
      # 并覆盖 sdk/typescript/docs 与 agentprimordia/docs 的"当前版本"声明。
      - name: Run doc version consistency check
        run: node scripts/doc-version-consistency.mjs

  perf-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run benchmark subset
        working-directory: agentprimordia
        run: |
          go test -bench='BenchmarkConsistentHash_GetNode|BenchmarkDistributedState|BenchmarkAgentRun|BenchmarkMemoryStore|BenchmarkMemoryLatency|BenchmarkP95' \
            -benchmem -benchtime=500ms -run='^$' -count=3 ./bench/suite/ | tee /tmp/bench-output.txt

      # 固定基线数值来自专用基准机，runner 硬件漂移会导致偏差误报；
      # CI 模式下降级为记录（回归判定在专用基准机执行）
      - name: Check for regressions against baseline
        env:
          CI_MODE: '1'
        run: bash scripts/bench-regression-check.sh /tmp/bench-output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/bench-output.txt
          retention-days: 30

  user-validation:
    name: User Validation (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run user validation script
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 0
        run: bash tests/validation/user-validation.sh
