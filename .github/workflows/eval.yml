name: Agent Eval

# 触发条件：每次 push / PR 触发 eval 套件；亦支持手动触发并指定通过率阈值
# 目的：检测 Agent 行为退化（输出质量、响应延迟、工具调用准确性）
#
# 与 CI workflow 的区别：
#   - ci.yml：编译 + 单元测试（每 PR 必须通过）
#   - eval.yml：行为评估（每 PR 通过但可标记为 soft-fail，便于追踪趋势）
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # 手动触发入口：可指定阈值。
  # 原实现中 job 名引用了未声明的 `inputs.threshold`（actionlint 报错），
  # 且脚本阈值被硬编码为 0.8 —— 说明该输入从未真正接线。此处补齐声明并接线。
  workflow_dispatch:
    inputs:
      threshold:
        description: '最小通过率阈值，取值范围 [0, 1]'
        required: false
        default: '0.8'
        type: string

jobs:
  eval:
    name: Eval Suite (threshold ${{ inputs.threshold || '0.8' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26.9-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.9-

      - name: Download dependencies
        run: go mod download

      - name: Build (sanity)
        working-directory: agentprimordia
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Run Eval Suite
        id: eval
        env:
          CGO_ENABLED: 0
          # 经 env 传入，避免把触发输入直接插值进 shell 命令行（注入面收敛）
          EVAL_THRESHOLD: ${{ inputs.threshold || '0.8' }}
        run: |
          set -uo pipefail
          cd agentprimordia
          # 阈值合法性预检（run_eval.sh 亦会校验；此处提前失败并给出明确报错）
          case "${EVAL_THRESHOLD}" in
            ''|*[!0-9.]*)
              echo "::error::threshold 必须为 [0,1] 之间的数值，got '${EVAL_THRESHOLD}'"
              exit 1
              ;;
          esac
          chmod +x bench/eval-ci/run_eval.sh
          # 捕获退出码（shell -e 下需先 set +e 才能拿到非零退出码）
          set +e
          ./bench/eval-ci/run_eval.sh --threshold "${EVAL_THRESHOLD}" --json > eval-result.json
          EVAL_EXIT=$?
          set -e
          cat eval-result.json
          # 退出码非 0 即低于阈值：软失败（不阻断，仅标记 warning）
          if [ $EVAL_EXIT -ne 0 ]; then
            echo "::warning::Eval suite did not meet threshold ${EVAL_THRESHOLD} (soft-fail, see logs)"
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-result-${{ github.run_id }}
          path: agentprimordia/eval-result.json
          if-no-files-found: ignore

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          header: agent-eval
          message: |
            ## Eval Suite Results
            $(cat agentprimordia/eval-result.json 2>/dev/null || echo '{}')

            See artifact `eval-result-${{ github.run_id }}` for full output.
