name: Nightly

on:
  schedule:
    # 每天 UTC 02:00 运行
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'

      - name: Download dependencies
        run: go mod download

      - name: Run all tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | tail -1

  security-scan:
    name: Nightly Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -test ./... 2>&1 | tee govulncheck-report.txt

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: govulncheck-report
          path: govulncheck-report.txt

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      # 修复评估报告 §7.5：原「Trivy 容器扫描」步骤以根 Dockerfile 为守卫
      # （根目录从未存在），且扫描的 agentprimordia:latest 镜像在本 job 未构建，
      # 属死代码——容器镜像扫描由 release.yml / supply-chain.yml 在构建时执行。

  dependency-freshness:
    name: Dependency Freshness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'

      - name: Check for outdated dependencies
        run: |
          go install github.com/psampaz/go-mod-outdated@latest
          go list -u -m -json all 2>/dev/null | go-mod-outdated -update -direct || true

      - name: npm audit (TypeScript SDK)
        working-directory: sdk/typescript
        run: |
          npm ci
          npm audit --audit-level=high || echo "::warning::npm audit 发现问题"
          echo "## 覆盖率报告" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 修复评估报告 §7.5：仓库根无 Dockerfile（Dockerfile 在 agentprimordia/），
      # 原 job 在根执行 docker build . 每次必失败。
      - name: Build Docker image
        working-directory: agentprimordia
        run: docker build . --tag agentprimordia:nightly

      - name: Verify image
        working-directory: agentprimordia
        run: docker run --rm agentprimordia:nightly echo "Docker image OK"

  chaos-engineering:
    name: Chaos Engineering Nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'

      - name: Download dependencies
        working-directory: agentprimordia
        run: go mod download

      - name: Run chaos engineering tests
        working-directory: agentprimordia
        run: |
          go test -v -race -count=1 -timeout=10m ./internal/chaos/... 2>&1 | tee chaos-report.txt

      - name: Run soak test (short mode)
        working-directory: agentprimordia
        run: |
          go test -v -race -count=1 -timeout=5m -run TestSoak ./internal/llm/soak/... 2>&1 | tee -a chaos-report.txt || true

      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chaos-nightly-report
          path: agentprimordia/chaos-report.txt

      - name: Summary
        if: always()
        run: |
          echo "## 混沌工程 Nightly 报告" >> $GITHUB_STEP_SUMMARY
          echo "运行时间: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f agentprimordia/chaos-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 agentprimordia/chaos-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ===== 真实 LLM 集成测试（多 Provider 可用性验证） =====
  #
  # 运行 TestIntegration_* 套件（//go:build integration 门控）：
  #   - 在仓库 Secrets 中配置对应 API Key 的 Provider 会跑真实调用
  #   - 未配置的 Provider 测试优雅跳过（SKIP），不会导致失败
  # 用于持续验证多 Provider（OpenAI/Anthropic/Gemini/Qwen/DeepSeek/GLM）
  # 的真实可用性，防止模型/凭据变更被无声吞掉。
  llm-integration:
    name: Real LLM Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'

      - name: Download dependencies
        run: go mod download

      - name: Run real LLM integration tests
        working-directory: agentprimordia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          go test -tags=integration -count=1 -timeout=15m \
            ./internal/llm/... ./internal/agent/... ./internal/guardrail/... ./internal/eval/... ./pkg/...

      - name: Summary
        if: always()
        run: |
          echo "## 真实 LLM 集成测试" >> $GITHUB_STEP_SUMMARY
          echo "运行时间: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "未配置 API Key 的 Provider 集成测试会跳过（SKIP）；" >> $GITHUB_STEP_SUMMARY
          echo "配置后跑真实调用，401/超时等凭据或服务问题会在此 job 暴露。" >> $GITHUB_STEP_SUMMARY

  # ===== 真实 LLM 跑分门禁（v3.5-2） =====
  #
  # 对 60 条真实 harness 基准集跑真实 LLM，产出 成功率/成本/耗时/恢复率 报告。
  # 版本门禁：通过率 ≥ max(基线, 阈值)，分数只升不降。
  # 基线文件: agentprimordia/bench/llm-bench/baseline.json（发版时以 --update-baseline 刷新）。
  # 未配置 OPENAI_API_KEY 时跳过（SKIP），不阻塞其余 nightly job。
  llm-benchmark:
    name: LLM Benchmark Gate (v3.5-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'

      - name: Download dependencies
        working-directory: agentprimordia
        run: go mod download

      - name: Run real LLM benchmark (gate vs baseline)
        id: bench
        working-directory: agentprimordia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY 未配置，跳过真实跑分门禁"
            exit 0
          fi
          set +e
          go run ./bench/llm-bench --provider openai --model gpt-4o-mini \
            --version nightly --threshold 0.8 --retries 1 \
            --out llm-bench-report.json 2>&1 | tee llm-bench-log.txt
          BENCH_EXIT=${PIPESTATUS[0]}
          set -e
          echo "bench_exit=$BENCH_EXIT" >> $GITHUB_OUTPUT
          exit $BENCH_EXIT

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-bench-report
          path: |
            agentprimordia/llm-bench-report.json
            agentprimordia/llm-bench-log.txt
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## 真实 LLM 跑分门禁" >> $GITHUB_STEP_SUMMARY
          if [ -f agentprimordia/llm-bench-report.json ]; then
            cat agentprimordia/llm-bench-report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "未产生报告（无 API Key 或跳过）" >> $GITHUB_STEP_SUMMARY
          fi

  # ===== TS 真实 LLM 跑分（v3.7-2 双线可比基线） =====
  # 与 Go 端跑分同一套基准集，产出可比分数。
  ts-llm-benchmark:
    name: TS LLM Benchmark (v3.7-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run TS real LLM benchmark
        id: tsbench
        working-directory: sdk/typescript
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY 未配置，跳过 TS 真实跑分"
            exit 0
          fi
          npx vitest run tests/integration/llm-bench.test.ts 2>&1 | tee ts-llm-bench-log.txt

      - name: Upload TS benchmark log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ts-llm-bench
          path: sdk/typescript/ts-llm-bench-log.txt
          if-no-files-found: ignore

  # ===== 双线真实 LLM 基准对照表（v4.2-5 可比化入 CI） =====
  # 同一模型在 Go 与 TS 两侧各跑一遍同一基准集，生成对照表
  # （bench/results/dual/dual-bench-comparison.{json,md}）随 nightly 发布。
  # 可比化契约：两侧用例集必须一致（scripts/dual-bench-compare.mjs 门禁）。
  # 未配置 OPENAI_API_KEY 时跳过。
  dual-bench:
    name: Dual-Line LLM Benchmark Compare (v4.2-5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TS dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run dual-line benchmarks and generate comparison table
        working-directory: agentprimordia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY 未配置，跳过双线跑分对照"
            exit 0
          fi
          MODEL=gpt-4o-mini
          # Go 侧报告
          go run ./bench/llm-bench --provider openai --model $MODEL \
            --version nightly --threshold 0 --retries 1 --out go-llm-bench-report.json
          # TS 侧报告（同一模型同一基准集）
          (cd ../sdk/typescript && npx --yes tsx bench/llm-bench/main.mts \
            --model $MODEL --threshold 0 --out ../agentprimordia/ts-llm-bench-report.json)
          # 对照表生成（用例集一致门禁）
          node ../scripts/dual-bench-compare.mjs \
            --go-report go-llm-bench-report.json \
            --ts-report ts-llm-bench-report.json \
            --out bench/results/dual
          echo "comparison_generated=true" >> $GITHUB_OUTPUT

      - name: Upload dual-line comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dual-bench-comparison
          path: |
            agentprimordia/bench/results/dual/dual-bench-comparison.json
            agentprimordia/bench/results/dual/dual-bench-comparison.md
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## 双线真实 LLM 基准对照表" >> $GITHUB_STEP_SUMMARY
          if [ -f agentprimordia/bench/results/dual/dual-bench-comparison.md ]; then
            cat agentprimordia/bench/results/dual/dual-bench-comparison.md >> $GITHUB_STEP_SUMMARY
          else
            echo "未生成对照表（无 API Key 或跳过）" >> $GITHUB_STEP_SUMMARY
          fi

  # ===== V7 S0 真实轨评测（冻结题面留出子集，R3/R4 口径） =====
  #
  # 双轨质量门的真实轨：对 docs/evals/ 冻结题面的留出子集跑真实 LLM。
  #   - external：外部泛化集机检判分（点估计 + Wilson95 下界成对报告，禁裸 100%）；
  #   - judge：judge 标定 vs 客观标签，Cohen κ 门 ≥0.6（S0-1 验收判据）。
  # 报告含题面 sha256 与冻结 commit，随 nightly 工件发布；跨夜趋势可对账。
  # 未配置 OPENAI_API_KEY 时 bench/eval-real 打印 SKIP（降级豁免 A1，§九）并退出 0。
  s0-real-eval:
    name: S0 Real-Track Eval (Holdout, R3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'

      # R4 冻结门：题面与台账 sha256 对账，任何漂移先红再说
      - name: 题面冻结门（eval-manifest verify）
        run: python3 scripts/eval-manifest.py --verify

      - name: 真实轨评测（外部泛化 + judge 标定，留出子集）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          STAMP=$(date -u +%Y%m%d)
          mkdir -p agentprimordia/bench/results/s0
          go run ./bench/eval-real --mode external --set external-general-v1.json --holdout \
            --out agentprimordia/bench/results/s0/external-general-holdout-$STAMP.json
          go run ./bench/eval-real --mode judge --set judge-calibration-v1.json --holdout \
            --out agentprimordia/bench/results/s0/judge-calibration-holdout-$STAMP.json

      - name: Upload S0 real-track reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s0-real-eval-reports
          path: agentprimordia/bench/results/s0/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## S0 真实轨评测（R3 口径：点估计 + Wilson95 下界）" >> $GITHUB_STEP_SUMMARY
          if ls agentprimordia/bench/results/s0/*.json >/dev/null 2>&1; then
            for f in agentprimordia/bench/results/s0/*.json; do
              echo "- $f" >> $GITHUB_STEP_SUMMARY
              python3 -c "import json;r=json.load(open('$f'));print('  ', r['mode'], r['summary'])" >> $GITHUB_STEP_SUMMARY || true
            done
          else
            echo "未产出报告：无 API Key → 降级豁免 A1（V7路线图 §九），回放轨照常，不伪造数字" >> $GITHUB_STEP_SUMMARY
          fi
