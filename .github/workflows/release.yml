name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binary
        working-directory: agentprimordia
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BINARY=ap-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=${BINARY}.exe
          fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o ${BINARY} ./cmd/ap/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ap-${{ matrix.goos }}-${{ matrix.goarch }}*

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Generate Go SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: .
          format: spdx-json
          output-file: sbom-go.spdx.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Generate Node SBOM with syft
        working-directory: sdk/typescript
        run: |
          npm ci
        # syft will scan the directory for both Go and Node dependencies

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.spdx.json

  sign-binaries:
    name: Sign Release Binaries
    runs-on: ubuntu-latest
    needs: [build-binaries, generate-sbom]
    permissions:
      contents: write
      id-token: write  # keyless cosign 签名必需（对照 supply-chain.yml）
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Generate SHA256 checksums
        run: |
          cd binaries
          find . -type f -name 'ap-*' | sort | xargs sha256sum > ../checksums-sha256.txt
          cd ..

      - name: Sign checksums with cosign
        uses: sigstore/cosign-installer@v3

      - run: cosign sign-blob --yes checksums-sha256.txt --output-signature checksums-sha256.txt.sig --output-certificate checksums-sha256.txt.pem

      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: |
            checksums-sha256.txt
            checksums-sha256.txt.sig
            checksums-sha256.txt.pem

  llm-benchmark:
    name: LLM Benchmark Report (v3.5-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        working-directory: agentprimordia
        run: go mod download

      - name: Run real LLM benchmark
        id: bench
        working-directory: agentprimordia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY 未配置，跳过真实跑分（发布将不附基准报告）"
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME#v}
          go run ./bench/llm-bench --provider openai --model gpt-4o-mini \
            --version ${VERSION} --threshold 0.8 --retries 1 \
            --out llm-bench-report.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-bench-report
          path: |
            agentprimordia/llm-bench-report.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## 发布基准报告" >> $GITHUB_STEP_SUMMARY
          if [ -f agentprimordia/llm-bench-report.json ]; then
            cat agentprimordia/llm-bench-report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "未产生报告（无 API Key）" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [sign-binaries, llm-benchmark]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release-files
          cp artifacts/binaries/**/* release-files/ || true
          cp artifacts/signatures/* release-files/ || true
          cp artifacts/sbom/* release-files/ || true
          cp artifacts/llm-bench-report/* release-files/ || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          generate_release_notes: true

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign 镜像签名必需（对照 supply-chain.yml build-and-sign）
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agentprimordia/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign container image with cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1  # keyless 签名必需（对照 supply-chain.yml）
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.meta.outputs.digest }}

  npm-publish:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Publish
        working-directory: sdk/typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
