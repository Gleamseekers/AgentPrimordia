name: Release

on:
  push:
    tags:
      - 'v*'

# 安全基线：不再使用工作流级 permissions（原为 contents:write + packages:write 全 job 继承，
# 过宽）。改为每个 job 按最小权限精确声明，见各 job 的 permissions 字段。
# 第三方 action 一律 pin 到 commit SHA（附可读版本注释），避免上游 tag 被移动导致供应链投毒。

jobs:
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 精确 pin：浮动 '1.26' 无法保证拿到已修补补丁版。
          # go1.26.9 修复了 govulncheck 报出的 11 个可达标准库漏洞
          # （net/http Range 头 DoS、html/template ×2、net/textproto、crypto/tls、os 等）。
          go-version: '1.26.9'

      - name: Assert Go toolchain is patched (>= 1.26.9)
        run: |
          set -euo pipefail
          GOV=$(go env GOVERSION)
          echo "构建工具链: ${GOV}"
          case "${GOV}" in
            go1.26.9|go1.26.1[0-9]|go1.2[7-9]*|go1.[3-9][0-9]*) ;;
            *)
              echo "::error::工具链 ${GOV} 低于安全下限 go1.26.9（含可达标准库漏洞），拒绝构建"
              exit 1
              ;;
          esac

      - name: Build binary
        working-directory: agentprimordia
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          BINARY=ap-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=${BINARY}.exe
          fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o ${BINARY} ./cmd/ap/
          test -s "${BINARY}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ap-${{ matrix.goos }}-${{ matrix.goarch }}
          # 路径相对 workspace 根解析（构建在 agentprimordia/ 子目录产出）——
          # 此前写 ap-*（根下不存在）触发了 v4 默认的 if-no-files-found: warn，
          # 二进制从未上传（v7.3.0 及历次 Release 资产均为 0/仅校验和的根因）。
          path: agentprimordia/ap-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - name: Generate Go SBOM with syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # 原为 image: .（image 输入期望容器镜像引用，传 "." 无法正确扫描目录）
          path: .
          format: spdx-json
          output-file: sbom-go.spdx.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          npm ci

      - name: Generate Node SBOM with syft
        # 原先此步骤只跑 npm ci，没有任何 syft 命令——注释声称 "syft will scan
        # the directory" 与实现不符，导致 TS/npm 依赖从未进入 SBOM。
        # 现补上真实扫描，产出独立资产 sbom-node.spdx.json。
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sdk/typescript
          format: spdx-json
          output-file: sbom-node.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-*.spdx.json
          if-no-files-found: error

  sign-binaries:
    name: Sign Release Binaries
    runs-on: ubuntu-latest
    needs: [build-binaries, generate-sbom]
    permissions:
      contents: read
      id-token: write  # keyless cosign 签名必需（对照 supply-chain.yml）
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten binaries and generate SHA256 checksums
        # 关键顺序：先扁平化 → 再算校验和 → 再签名。
        # 旧实现直接在 binaries/ 内 find，产出形如 ./ap-linux-amd64/ap-linux-amd64 的
        # 带目录前缀条目；而 release 作业会把产物扁平化为 ap-linux-amd64，
        # 导致用户侧 `sha256sum -c` 全部报 No such file or directory（校验和签名形同虚设）。
        run: |
          set -euo pipefail
          mkdir -p flat
          find artifacts -type f -name 'ap-*' -exec cp {} flat/ \;
          COUNT=$(ls -1 flat | wc -l | tr -d ' ')
          echo "扁平化后二进制数: ${COUNT}"
          if [ "${COUNT}" -ne 6 ]; then
            echo "::error::期望 6 个平台二进制，实际 ${COUNT} 个"
            ls -la flat
            exit 1
          fi
          cd flat
          sha256sum ap-* > ../checksums-sha256.txt
          cd ..
          echo "--- checksums-sha256.txt ---"
          cat checksums-sha256.txt
          test -s checksums-sha256.txt
          # 自校验回归门：确认清单与文件名逐条对应（B1 缺陷一旦复现即在此失败）
          (cd flat && sha256sum -c ../checksums-sha256.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with cosign
        run: |
          set -euo pipefail
          cosign sign-blob --yes checksums-sha256.txt \
            --output-signature checksums-sha256.txt.sig \
            --output-certificate checksums-sha256.txt.pem

      - name: Upload signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: |
            checksums-sha256.txt
            checksums-sha256.txt.sig
            checksums-sha256.txt.pem
          if-no-files-found: error

  llm-benchmark:
    name: LLM Benchmark Report (v3.5-2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 质量门禁不阻断发布链路：原先该 job 失败会使 release 作业被 needs 跳过，
    # 而 docker 作业已推送镜像 → 出现「镜像有、Release 无」的半成品发布态。
    # 现改为 advisory（结果进 job summary + 标注），硬门禁应放在 ci.yml（打 tag 前）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - name: Download dependencies
        working-directory: agentprimordia
        run: |
          set -euo pipefail
          go mod download

      - name: Run real LLM benchmark
        id: bench
        working-directory: agentprimordia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY 未配置，跳过真实跑分（发布将不附基准报告）"
            echo "gate=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME#v}
          if go run ./bench/llm-bench --provider openai --model gpt-4o-mini \
               --version ${VERSION} --threshold 0.8 --retries 1 \
               --out llm-bench-report.json; then
            echo "gate=passed" >> "$GITHUB_OUTPUT"
          else
            # 退出码非 0 仅表示门禁未达标；因 job 级 continue-on-error，不阻断发布。
            echo "::warning::LLM 基准门禁未达标（pass_rate < gate）。本次发布不受阻，请维护者评估是否撤回。"
            echo "gate=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-bench-report
          path: |
            agentprimordia/llm-bench-report.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## 发布基准报告"
            echo ""
            echo "- 门禁状态: \`${{ steps.bench.outputs.gate || 'unknown' }}\`"
          } >> $GITHUB_STEP_SUMMARY
          if [ -f agentprimordia/llm-bench-report.json ]; then
            cat agentprimordia/llm-bench-report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "未产生报告（无 API Key）" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    # 不再 needs llm-benchmark（见该 job 注释）。
    needs: [sign-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Organize release files and assert completeness
        # download-artifact@v4 按 artifact 名分目录下载（ap-<os>-<arch>/、
        # signatures/、sbom/、llm-bench-report/，部分还带嵌套路径）。
        # 统一 find 扁平化拷贝；此前误写 artifacts/binaries/**（不存在该名
        # 产物）致 6 个平台二进制全部静默缺失（|| true 吞掉错误）。
        # 本步骤补齐产物完整性断言：任何一项缺失即失败，不再静默产出空/残缺 Release。
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f -exec cp -n {} release-files/ \;

          SRC=$(find artifacts -type f | wc -l | tr -d ' ')
          DST=$(find release-files -type f | wc -l | tr -d ' ')
          echo "artifacts 文件数=${SRC}  release-files 文件数=${DST}"
          echo "发布文件:"; ls -la release-files/
          if [ "${SRC}" -ne "${DST}" ]; then
            echo "::error::扁平化出现同名覆盖，以下文件重名："
            find artifacts -type f -printf '%f\n' | sort | uniq -d
            exit 1
          fi

          BIN_COUNT=$(find release-files -maxdepth 1 -type f -name 'ap-*' | wc -l | tr -d ' ')
          echo "平台二进制数: ${BIN_COUNT}"
          if [ "${BIN_COUNT}" -ne 6 ]; then
            echo "::error::期望 6 个平台二进制，实际 ${BIN_COUNT} 个"
            exit 1
          fi

          for f in checksums-sha256.txt checksums-sha256.txt.sig checksums-sha256.txt.pem; do
            if [ ! -s "release-files/${f}" ]; then
              echo "::error::缺少或为空的发布资产: ${f}"
              exit 1
            fi
          done

          SBOM_COUNT=$(find release-files -maxdepth 1 -name 'sbom-*.spdx.json' | wc -l | tr -d ' ')
          if [ "${SBOM_COUNT}" -lt 1 ]; then
            echo "::error::未找到 SBOM 发布资产"
            exit 1
          fi
          echo "SBOM 资产数: ${SBOM_COUNT}"

          # 用户侧同款校验：确保发布的校验和清单与发布的二进制逐条对应
          (cd release-files && sha256sum -c checksums-sha256.txt)

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-files/*
          generate_release_notes: true

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    # 待签名与校验和产物就绪后再推镜像，避免发布校验和失效时镜像已落地
    needs: [build-binaries, sign-binaries]
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign 镜像签名必需（对照 supply-chain.yml build-and-sign）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agentprimordia/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 注入版本号：Dockerfile.prod 原先用 `git describe`，但 .dockerignore 排除了
          # .git，容器内必然回退为 "dev" —— 镜像内 ap-admin 版本号恒为 dev。
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        # 供应链硬门：镜像签名失败即失败，不再降级为 ::warning::。
        # 原先降级会导致未签名镜像被推送到 ghcr.io 并被下游拉取。
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "${DIGEST}" ]; then
            echo "::error::build 步骤未输出 digest，无法定位签名目标"
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "✅ 已按 digest 完成 keyless 签名: ${IMAGE}@${DIGEST}"

  npm-publish:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Check NPM token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN secret 未配置（仓库 secrets 为空）——跳过 npm 发布。需维护者添加 npm automation token 后手动触发发布。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.token.outputs.skip != 'true'
        working-directory: sdk/typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
