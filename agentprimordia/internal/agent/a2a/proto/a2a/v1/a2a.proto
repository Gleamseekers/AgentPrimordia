syntax = "proto3";

package a2a.v1;

option go_package = "github.com/Gleamseekers/AgentPrimordia/internal/agent/a2a/proto/a2a/v1;a2av1";

import "google/protobuf/timestamp.proto";

// A2AService 定义 Agent-to-Agent 协议的 gRPC 服务。
service A2AService {
  // GetAgentCard 获取远端 Agent 的能力卡片。
  rpc GetAgentCard(GetAgentCardRequest) returns (AgentCard);

  // CreateTask 创建一个新任务。
  rpc CreateTask(CreateTaskRequest) returns (Task);

  // GetTask 查询任务状态。
  rpc GetTask(GetTaskRequest) returns (Task);

  // CancelTask 取消任务。
  rpc CancelTask(CancelTaskRequest) returns (Task);

  // SubscribeTaskEvents 订阅任务事件流（server-streaming）。
  rpc SubscribeTaskEvents(SubscribeTaskEventsRequest) returns (stream TaskEvent);
}

message GetAgentCardRequest {}

message CreateTaskRequest {
  Message message = 1;
  string task_id = 2;
  string session_id = 3;
}

message GetTaskRequest {
  string id = 1;
}

message CancelTaskRequest {
  string id = 1;
}

message SubscribeTaskEventsRequest {
  string id = 1;
}

// AgentCard 描述 Agent 的能力、技能和端点信息。
message AgentCard {
  string protocol = 1;
  string agent_id = 2;
  string name = 3;
  string description = 4;
  AgentCapabilities capabilities = 5;
  AgentEndpoints endpoints = 6;
  repeated SecurityScheme security_schemes = 7;
  repeated AgentSkill skills = 8;
  map<string, string> metadata = 9;
}

message AgentCapabilities {
  repeated string input_modes = 1;
  repeated string output_modes = 2;
  bool streaming = 3;
}

message AgentEndpoints {
  string base_url = 1;
  string task_send = 2;
  string task_get = 3;
  string task_cancel = 4;
  string task_subscribe = 5;
  string agent_card_url = 6;
}

message SecurityScheme {
  string scheme = 1;
  string in = 2;
  string name = 3;
  repeated string scopes = 4;
}

message AgentSkill {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string input_modes = 4;
  repeated string output_modes = 5;
}

// Task 表示一个 A2A 任务。
message Task {
  string id = 1;
  string session_id = 2;
  string state = 3;
  Message message = 4;
  TaskStatus status = 5;
  repeated Artifact artifacts = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message TaskStatus {
  string state = 1;
  string error_message = 2;
  Message stream_message = 3;
}

// Message 是 A2A 协议消息。
message Message {
  string role = 1;
  repeated Part parts = 2;
  string message_id = 3;
  string parent_id = 4;
}

// Part 表示消息内容片段，可以是文本、文件或结构化数据。
message Part {
  string type = 1;
  oneof content {
    TextPart text = 2;
    FilePart file = 3;
    DataPart data = 4;
  }
}

message TextPart {
  string text = 1;
}

message FilePart {
  oneof source {
    FileWithBytes file_bytes = 1;
    FileWithURI file_uri = 2;
  }
  string mimetype = 3;
  string filename = 4;
}

message FileWithBytes {
  string name = 1;
  string mime_type = 2;
  bytes bytes = 3;
}

message FileWithURI {
  string uri = 1;
  string mime_type = 2;
}

message DataPart {
  bytes data = 1;
}

// Artifact 是任务产物。
message Artifact {
  string artifact_id = 1;
  string mimetype = 2;
  bytes bytes = 3;
  string uri = 4;
  google.protobuf.Timestamp created_at = 5;
}

// TaskEvent 是任务事件流中的事件。
message TaskEvent {
  string type = 1;
  string task_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  string state = 4;
  Message message = 5;
  Artifact artifact = 6;
  string error = 7;
}
